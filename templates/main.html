<!DOCTYPE html>
{% load static %}
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
  <!-- Icon - IconMonster -->
  <link rel="stylesheet" href="https://cdn.iconmonstr.com/1.3.0/css/iconmonstr-iconic-font.min.css" />
  
  <!-- Mumble UI -->
 <link rel="stylesheet" href="{% static 'uikit/styles/uikit.css' %}" />
  
 <!-- Dev Search UI -->
  <link rel="stylesheet" href="{% static 'styles/app.css' %}" />

  <title>SokoDirect - Connect with Farmers!</title>
</head>

<body>
    {% include 'navbar.html' %}

    <!-- Inject Global System Messages UI 
         To ensure alerts (errors, notifications, or successes) display seamlessly across any page 
        a user visits, we inject the messaging processor loop directly into our master layout file.
e    -->
    {% if messages %}
        <div class="messages-container" style="background: #f4f4f4; padding: 10px; margin-bottom: 20px;">
            {% for message in messages %}
                <div class="alert alert--{{ message.tags }}">
                    <p class="alert__message" style="font-weight: bold;">{{ message }}</p>
                    <button class="alert__close" onclick="this.parentElement.remove();" style="cursor: pointer;">×</button>
                </div>
            {% endfor %}
        </div>
    {% endif %}


    {% block content %}
    {% endblock content %}

    <p>SokoDirect — Connecting Kenyan Farmers to Buyers</p>
</body>
</html>
