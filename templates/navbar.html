{% load static %}

  <!-- Header Section -->
  <header class="header">
    <div class="container container--narrow">
      <!-- Logo - now goes to user(farmer) profiles (homepage) -->
      <a href="{% url 'profiles' %}" class="header__logo">
        <img src="{% static 'images/logo.svg' %}" alt="FarmerSearch Logo" />
      </a>
      <nav class="header__nav">
        <input type="checkbox" id="responsive-menu" />
        <label for="responsive-menu" class="toggle-menu">
          <span>Menu</span>
          <div class="toggle-menu__lines"></div>
        </label>
        <ul class="header__menu">
          <li class="header__menuItem">
            <!-- Nav link to user(farmer) profiles -->
            <a href="{% url 'profiles' %}">Farmers</a>
          </li>
          <li class="header__menuItem">
            <a href="{% url 'products' %}">Products</a>
          </li>
          <li class="header__menuItem"><a href="">Inbox</a></li>
          
          
          {% if request.user.is_authenticated %}
            <li class="header__menuItem"><a href="{%url 'account' %}" class="btn btn--sub">Account</a></li>
            <li class="header__menuItem"><a href="{% url 'logout' %}" class="btn btn--sub">Logout</a></li>
          {% else %}
            <li class="header__menuItem"><a href="{% url 'login' %}" class="btn btn--sub">Login/Sign Up</a></li>  
          {% endif %}

        </ul>
      </nav>
    </div>
  </header>
