{% extends 'main.html' %}
{% block content %}

<h2>Add New Produce Listing</h2>

<form method="POST">
    {% csrf_token %}

    {% for field in form %}
        <div>
            {{ field.label }}
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}

    <input type="submit" value="Submit Listing">
</form>

{% endblock content %}
