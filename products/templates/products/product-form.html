{% extends 'main.html' %}
{% block content %}

<h2>Add New Produce Listing</h2>

<!-- enctype needed for image/file uploads -->
<form method="POST" enctype="multipart/form-data">

    <!-- CSRF token — always required on POST forms -->
    {% csrf_token %}

    <!-- as_p wraps each field in paragraph tags (cleaner layout) -->
    {{ form.as_p }}

    <input type="submit" value="Submit Listing">
</form>

{% endblock content %}
