<!DOCTYPE html>
<html>
<head>
<title>Soko Direct | Login</title>
<style>

body {
    margin: 0;
    font-family: Arial;
    background-image: url('https://images.unsplash.com/photo-1488459716781-31db52582fe9?w=1600&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
}

.overlay {
    min-height: 100vh;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 380px;
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(0,0,0,.3);
}

h1 {
    text-align: center;
    color: #1c7c54;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    margin-bottom: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    background: #1c7c54;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    opacity: .9;
}

a {
    text-decoration: none;
    color: #1c7c54;
}

.bottom {
    text-align: center;
    margin-top: 20px;
}

.error {
    color: red;
}

</style>
</head>
<body>

<div class="overlay">
    <div class="container">

        <h1>Login</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username">
            <input type="password" name="password" placeholder="Password">
            <button type="submit">Log In</button>
        </form>

        <div class="bottom">
            Not registered?
            <a href="/users/signup/">Create account</a>
        </div>

    </div>
</div>

</body>
</html>
