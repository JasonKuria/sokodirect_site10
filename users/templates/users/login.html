{% extends 'main.html' %}
{% block content %}

<div style="max-width: 420px; margin: 80px auto; padding: 40px 36px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
    
    <h2 style="text-align: center; color: #113821; font-size: 2rem; margin-bottom: 8px;">Welcome Back</h2>
    <p style="text-align: center; color: #6b7280; font-size: 1.3rem; margin-bottom: 28px;">Login to Soko Direct</p>

    {% if messages %}
        {% for message in messages %}
            <p style="color: #dc2626; background: #fef2f2; padding: 10px 14px; border-radius: 6px; font-size: 1.3rem; margin-bottom: 16px;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div style="margin-bottom: 18px;">
            <label style="display: block; font-size: 1.3rem; font-weight: 600; color: #374151; margin-bottom: 6px;">Username</label>
            <input type="text" name="username" required
                style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1.3rem; outline: none; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 24px;">
            <label style="display: block; font-size: 1.3rem; font-weight: 600; color: #374151; margin-bottom: 6px;">Password</label>
            <input type="password" name="password" required
                style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1.3rem; outline: none; box-sizing: border-box;">
        </div>

        <button type="submit"
            style="width: 100%; padding: 12px; background: #1e8a57; color: white; border: none; border-radius: 8px; font-size: 1.4rem; font-weight: 600; cursor: pointer;">
            Login
        </button>
    </form>

    <p style="text-align: center; margin-top: 20px; font-size: 1.3rem; color: #6b7280;">
        Don't have an account? <a href="#" style="color: #1e8a57; font-weight: 600;">Sign Up</a>
    </p>

</div>

{% endblock %}
